name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish a single self-contained .exe
        run: >
          dotnet publish windows/SpaceRemote/SpaceRemote.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceRemote-Windows
          path: out/SpaceRemote.exe

      - name: Publish the viewer (control this PC from another PC)
        run: >
          dotnet publish windows/SpaceRemoteViewer/SpaceRemoteViewer.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out-viewer

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceRemote-Viewer
          path: out-viewer/SpaceRemoteViewer.exe

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Same debug key on every build -> updates install over the old app
      - name: Reuse debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: spaceremote-debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SpaceRemote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceRemote-Android
          path: SpaceRemote.apk

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SpaceRemote-Windows/SpaceRemote.exe
            dist/SpaceRemote-Viewer/SpaceRemoteViewer.exe
            dist/SpaceRemote-Android/SpaceRemote.apk
